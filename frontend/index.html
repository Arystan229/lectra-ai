<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LECTRA</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="product.css">
</head>
<body>
<a class="skip-link" href="#noteHeading" data-ui="К заметкам">К заметкам</a>
<div id="app" class="app">
  <button id="navigationBackdrop" class="navigation-backdrop" aria-label="Закрыть навигацию" data-ui-label="Закрыть навигацию" tabindex="-1" hidden></button>
  <aside id="sidebar" class="sidebar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">L</span><div>lectra<span class="brand-caption" data-ui="Учебный блокнот">Учебный блокнот</span></div></div><button id="closeNavigation" class="side-close icon-button" data-label="navigation" data-icon="menu"></button>
    <button id="newLecture" class="primary full"><span aria-hidden="true">+</span><span data-i18n="newLecture"></span></button>
    <label class="search"><span data-icon="search"></span><input id="searchLectures" data-placeholder="searchLectures" data-label="searchLectures" type="search"></label>
    <div class="side-label" data-i18n="subjects"></div><div id="folders"></div>
    <button id="newFolder" class="quiet full" data-i18n="newFolder"></button>
    <div class="side-label" data-i18n="lectures"></div><nav id="lectureList"></nav>
    <div class="side-footer"><span id="keyState"></span><p data-i18n="localOnly"></p><button id="backup" class="quiet" data-i18n="backup"></button><button id="restore" class="quiet" data-i18n="restore"></button><input id="restoreFile" type="file" accept="application/json" hidden></div>
  </aside>
  <main id="mainContent">
    <header class="topbar"><button id="toggleNav" aria-controls="sidebar" aria-expanded="true" class="icon-button" data-label="navigation" data-icon="menu"></button><span class="crumb" data-i18n="workspace"></span><div class="top-actions"><label class="interface-language"><span data-i18n="interfaceLanguage"></span><select id="uiLanguage"><option value="ru">Русский</option><option value="en">English</option><option value="zh">中文</option></select></label><details id="downloads"><summary data-i18n="download"></summary><div id="downloadItems" class="dropdown"></div></details></div></header>
    <div class="page">
      <div id="notice" class="notice" role="status" hidden></div>
      <div class="document-heading"><textarea id="lectureTitle" rows="1" class="title-input" data-placeholder="newLecture" aria-label="Название лекции"></textarea><span id="saveState" class="save-state" role="status"></span></div>
      <div class="preferences"><label><span data-i18n="subject"></span><select id="subject"></select></label><label><span data-i18n="originalLanguage"></span><select id="originalLanguage"></select></label><label><span data-i18n="materialsLanguage"></span><select id="materialsLanguage"></select></label></div>
      <section class="recording-panel" aria-label="Запись лекции" data-ui-label="Запись лекции">
        <div class="record-actions"><button id="startRecording" class="primary"><span data-icon="mic"></span><span data-i18n="start"></span></button><button id="uploadAudio" class="secondary"><span data-icon="upload"></span><span data-i18n="uploadAudio"></span></button><input id="audioFile" type="file" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg,.oga,.opus,.flac,.webm,.weba,.mp4" hidden><span id="recordStatus" class="record-status"></span><strong id="timer" class="timer" hidden>00:00</strong><meter id="level" min="0" max="1" value="0" hidden></meter></div>
        <details class="audio-import-help"><summary data-i18n="importHelp"></summary><div><button id="browseAudioFiles" class="quiet" data-i18n="browseFiles"></button><input id="audioFileFallback" type="file" hidden><p class="hint" data-i18n="pickerHint"></p><p class="hint" data-i18n="audioFormats"></p></div></details>
        <div id="recordControls" class="record-controls" hidden><label class="keep-awake"><input id="keepScreenAwake" type="checkbox" checked> <span data-ui="Не выключать экран"></span></label><span id="wakeStatus" class="hint" role="status"></span><button id="pauseRecording" class="secondary" data-i18n="pause"></button><button id="stopRecording" class="primary" data-i18n="finish"></button><button id="markTime" class="quiet" data-i18n="mark"></button><button id="confusedTime" class="quiet" data-i18n="confused"></button></div>
        <div id="audioArea" hidden><audio id="audioPlayer" playsinline controls preload="metadata"></audio><div class="audio-actions"><span id="audioName"></span><a id="downloadAudio" class="audio-download secondary" data-i18n="audioExport" download hidden></a><button id="shareAudio" class="secondary" data-i18n="shareAudio" hidden></button><button id="analyze" class="primary" data-i18n="analyze"></button></div></div>
        <div class="audio-transfer" role="status"><span id="audioStatus"></span><progress id="audioProgress" max="1" value="0" hidden aria-label="Передача аудио" data-ui-label="Передача аудио"></progress><button id="cancelAudioUpload" class="quiet" data-i18n="cancelUpload" hidden></button></div><p id="playbackError" class="hint" hidden></p><p class="hint" data-i18n="recordHint"></p><p id="microphoneError" class="error" role="alert" hidden></p>
      </section>
      <div class="viewbar"><div class="view-tabs" role="tablist"><button data-view="notes" data-i18n="myNotes"></button><button data-view="materials" data-i18n="lectureMaterials"></button><button data-view="final" data-i18n="finalNotes"></button></div><button id="splitView" class="quiet" data-i18n="sideBySide"></button></div>
      <div id="workspace" class="workspace">
        <section id="notesPane" class="document-pane"><div class="document-tools"><div class="section-heading"><span class="eyebrow" data-i18n="personalSpace"></span><h2 id="noteHeading" tabindex="-1" data-i18n="myNotes"></h2></div><div class="toolbar" role="toolbar"><button data-format="bold" data-label="bold" title="Ctrl+B"><b>B</b></button><button data-format="italic" data-label="italic" title="Ctrl+I"><i>I</i></button><select class="text-style" aria-label="Стиль текста" data-ui-label="Стиль текста"><option value="p" data-ui="Текст">Текст</option><option value="h2" data-ui="Заголовок">Заголовок</option><option value="h3" data-ui="Подзаголовок">Подзаголовок</option></select><button data-format="insertUnorderedList" data-icon="list" data-label="bullets"></button><button data-format="insertOrderedList" data-label="numbered">1.</button><button id="checklist" data-icon="check" data-label="checklist"></button><button data-format="hiliteColor" data-value="#FFF0B5" data-icon="highlight" data-label="highlight"></button><button id="insertLink" data-icon="link" data-label="link"></button><button data-format="formatBlock" data-value="blockquote" data-icon="quote" data-label="quote"></button><button id="insertImage" data-icon="image" data-label="image"></button><button data-format="undo" data-icon="undo" data-label="undo"></button><button data-format="redo" data-icon="redo" data-label="redo"></button><button id="addDrawing" data-icon="pen" data-label="addDrawing"></button></div><input id="imageFile" type="file" accept="image/*" hidden></div><div id="noteBlocks"></div><button id="addText" class="quiet" data-i18n="addText"></button></section>
        <div id="panelDivider" role="separator" aria-label="Ширина панелей" aria-orientation="vertical" aria-valuemin="35" aria-valuemax="65" aria-valuenow="50" tabindex="0" hidden></div>
        <section id="materialsPane" class="document-pane" hidden><div class="material-tabs"><button data-material="summary" data-i18n="summary"></button><button data-material="transcript" data-i18n="transcript"></button><button data-material="quiz" data-i18n="quiz"></button></div><div id="materialContent"></div></section>
        <section id="finalPane" class="document-pane" hidden><div class="final-actions"><h2 data-i18n="finalNotes"></h2><button id="buildFinal" class="primary" data-i18n="buildFinal"></button></div><p class="hint" data-i18n="mergeHint"></p><div id="draftPreview" hidden></div><div id="finalBlocks"></div><button id="addFinalText" class="quiet" data-i18n="addText"></button></section>
      </div>
      <footer class="page-footer"><span data-i18n="localOnly"></span><span data-i18n="privacy"></span></footer>
    </div>
  </main>
</div>
<dialog id="drawingDialog" aria-labelledby="drawingTitle"><div class="drawing-header"><h2 id="drawingTitle" data-i18n="drawing"></h2><button id="closeDrawing" data-i18n="done"></button></div><div class="drawing-toolbar"><button data-tool="pen" data-i18n="pen"></button><button data-tool="marker" data-i18n="marker"></button><button data-tool="eraser" data-i18n="eraser"></button><button data-tool="move" data-i18n="move"></button><button data-tool="pan" data-i18n="navigateCanvas"></button><input id="inkColor" type="color" value="#315c9b" aria-label="Цвет"><select id="inkWidth"><option value="2">2 px</option><option value="4" selected>4 px</option><option value="8">8 px</option><option value="14">14 px</option></select><button id="drawUndo" data-icon="undo" data-label="undo"></button><button id="drawRedo" data-icon="redo" data-label="redo"></button><button id="drawClear" data-i18n="clear"></button></div><label class="touch-setting"><input id="fingerDrawing" type="checkbox" checked><span data-i18n="fingerDrawing"></span></label><div class="canvas-surface"><canvas id="drawCanvas" width="1000" height="650"></canvas></div><p class="hint" data-i18n="drawingHint"></p></dialog>
<script src="ui-i18n.js"></script>
<script src="notebook-ui.js"></script>
<script src="mobile-audio.js"></script>
<script src="app.js"></script>
<script src="paper.js"></script>
<script src="product.js"></script>
</body></html>
